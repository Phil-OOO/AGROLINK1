services:
  - type: web
    name: agrolink
    runtime: docker
    plan: starter
    dockerfilePath: ./agrolink/Dockerfile
    dockerContext: ./agrolink
    disk:
      name: agrolink-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AGROLINK_DATA_DIR
        value: /data
      - key: AGROLINK_WEB
        value: "1"
